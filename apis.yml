name: Ventus Therapeutics
description: 'Ventus Therapeutics is a clinical-stage biopharmaceutical company focused on small-molecule
  drug discovery for biologically validated targets historically considered undruggable, across inflammatory,
  immunological, cardiometabolic, and neurological diseases. Its ReSOLVE platform combines AI/ML, protein
  science, structural biology, and biophysics to accelerate discovery; the pipeline includes VENT-03 (cGAS
  inhibitor), VENT-02 (NLRP3 inhibitor), and VENT-04 (caspase-4/5 inhibitor). Headquartered in Waltham,
  Massachusetts with a site in Saint-Laurent, Quebec, and backed by GV and the SoftBank Vision Fund. The
  company operates no public developer API surface; this profile is maintained in the API Evangelist network
  as a company/provider record.'
